
services:
  olp:
    image: ${DOCKER_REGISTRY-}olp
    build:
      context: .
      dockerfile: OLP/Dockerfile
    container_name: olp-api
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - olp-uploads:/app/data/files
    networks:
      - olp-network

  frontend:
    image: olp-frontend:local
    container_name: olp-frontend
    build:
      context: ../../olp-frontend
      dockerfile: Dockerfile
    depends_on:
      - olp
    ports:
      - "4200:80"
    restart: unless-stopped
    networks:
      - olp-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: olp-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?SQL password missing}
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - olp-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    restart: unless-stopped
    networks:
      - olp-network

  redis:
    image: redis:7-alpine
    container_name: olp-redis
    volumes:
      - olp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - olp-network

volumes:
  olp-sqldata:
  olp-redisdata:
  olp-uploads:

networks:
  olp-network:
    driver: bridge
